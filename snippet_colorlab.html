<!-- ══════════════════════════════════════════════════════════
     カラー診断アプリ（12タイプ／顔写真診断／コーデ提案／コーデ採点／NGカラー 等）

     設置先の blubel.jp / iebel.jp は Next.js の SPA。サイト内リンクから来ると
     クライアント遷移になり、ページ本文に貼った <script> は
     ブラウザ仕様上まったく実行されない（React が innerHTML 相当で差し込むため）。
     そのため v1.12.0 から、貼り付け方を2箇所に分けている。
     ══════════════════════════════════════════════════════════ -->

<!-- ── ① サイト共通の <head>（全ページ）に、この1行だけを入れる ──
     mount() の呼び出しは不要。アプリが #colorlab-root を自分で見つけてマウントする。 -->
<script src="https://cdn.jsdelivr.net/gh/thecompany20220901-cpu/colorlab-embed@v1.14.0/dist/colorlab.iife.js" defer></script>


<!-- ── ② アプリを出したいページの本文には、この1行だけを置く ──
     本文側に <script> は置かないこと（置くと同じ 420KB を二重に読み込む）。 -->
<div id="colorlab-root">アプリを読み込み中…</div>
